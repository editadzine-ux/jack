<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>SPUDVENTURE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0604; }
    body {
      font-family: 'Courier New', Courier, monospace; user-select: none;
      -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none; touch-action: none;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* ── HUD root ── */
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

    /* Health strips (potato skins) */
    #health { position: absolute; top: clamp(12px, 3vw, 18px); right: clamp(12px, 3vw, 18px); display: flex; gap: clamp(5px, 1.5vw, 8px); }
    .skin-strip {
      width: clamp(16px, 4.6vw, 22px); height: clamp(42px, 12vw, 58px); border-radius: 10px 10px 14px 14px;
      background: linear-gradient(160deg, #d8a55e 0%, #c8964e 45%, #9c6f33 100%);
      box-shadow: inset 0 -6px 8px rgba(60,35,10,.45), 0 2px 6px rgba(0,0,0,.5);
      border: 1px solid rgba(60,35,10,.6);
      transition: transform 1.1s cubic-bezier(.55,-0.3,.7,.4), opacity 1s ease;
      transform-origin: top center;
    }
    .skin-strip.peeled {
      transform: translateY(120px) rotate(140deg) scaleY(.6);
      opacity: 0;
    }

    /* Panic meter */
    #panic-wrap {
      position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%);
      width: 260px; height: 14px; border-radius: 7px;
      background: rgba(20, 8, 2, .65); border: 1px solid rgba(255,120,30,.4);
      opacity: 0; transition: opacity .25s ease;
    }
    #panic-wrap.visible { opacity: 1; }
    #panic-bar {
      height: 100%; width: 0%; border-radius: 7px;
      background: linear-gradient(90deg, #ff5a00, #ffb340);
      box-shadow: 0 0 12px 2px rgba(255,110,20,.8), 0 0 28px 6px rgba(255,80,0,.45);
      transition: width .12s linear;
    }

    /* Danger arrow — orbits screen centre, points at the oven */
    #arrow-pivot {
      position: absolute; left: 50%; top: 50%; width: 0; height: 0;
    }
    #danger-arrow {
      position: absolute; left: -14px; top: -150px;
      width: 0; height: 0; opacity: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 24px solid #ff6a1a;
      filter: drop-shadow(0 0 8px rgba(255,90,10,.9));
    }

    /* Analog clock */
    #clock { position: absolute; top: 18px; left: 18px; opacity: .85; }

    /* Rage screen-edge pulse */
    #rage-overlay {
      position: absolute; inset: 0; opacity: 0; transition: opacity .6s ease;
    }
    #rage-overlay.active { opacity: 1; animation: ragePulse 1.1s ease-in-out infinite; }
    @keyframes ragePulse {
      0%, 100% { box-shadow: inset 0 0 80px 18px rgba(255, 90, 0, .35); }
      50%      { box-shadow: inset 0 0 140px 46px rgba(255, 60, 0, .65); }
    }

    /* Win / lose screens */
    #endscreen {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: rgba(4, 2, 1, 0); transition: background 1.6s ease;
      pointer-events: none;
    }
    #endscreen.shown { background: rgba(4, 2, 1, .82); pointer-events: auto; }
    .end-title {
      font-size: 72px; letter-spacing: 14px; color: #f0ede8; font-weight: 700;
      opacity: 0; transform: translateY(10px);
      transition: opacity 1.4s ease, transform 1.4s ease;
    }
    .end-sub {
      font-size: 22px; letter-spacing: 6px; color: rgba(240,237,232,.55);
      opacity: 0; transition: opacity 1.6s ease .9s;
    }
    #endscreen.shown .end-title { opacity: 1; transform: translateY(0); }
    #endscreen.shown .end-sub { opacity: 1; }
    #restart-btn {
      margin-top: 26px; padding: 12px 34px; font-family: inherit; font-size: 16px;
      letter-spacing: 4px; color: #f0ede8; background: transparent;
      border: 1px solid rgba(240,237,232,.5); border-radius: 4px; cursor: pointer;
      opacity: 0; transition: opacity .8s ease, background .2s ease;
      pointer-events: none;
    }
    #restart-btn.shown { opacity: 1; pointer-events: auto; }
    #restart-btn:hover { background: rgba(240,237,232,.12); }

    /* Controls hint (fades out, not a popup) */
    #controls-hint {
      position: absolute; bottom: 16px; right: 18px; font-size: 12px;
      letter-spacing: 2px; color: rgba(240,237,232,.45);
      text-align: right; line-height: 1.8;
      transition: opacity 2s ease;
    }

    /* ── Touch controls (shown only on touch devices) ── */
    #touch { position: absolute; inset: 0; display: none; }
    #hud.touch #touch { display: block; }
    #hud.touch #controls-hint { display: none; }
    /* whole left half of the screen is the joystick zone */
    #joy-zone {
      position: absolute; left: 0; top: 0; bottom: 0; width: 48%;
      pointer-events: auto; touch-action: none;
    }
    #joy-base {
      position: absolute; width: 134px; height: 134px; margin: -67px;
      border-radius: 50%; background: rgba(240,237,232,.1);
      border: 1px solid rgba(240,237,232,.35); display: none;
    }
    #joy-knob {
      position: absolute; left: 50%; top: 50%; width: 58px; height: 58px;
      margin: -29px; border-radius: 50%;
      background: rgba(240,237,232,.35); border: 1px solid rgba(240,237,232,.5);
    }
    #touch-hint {
      position: absolute; left: 22px; bottom: 26px; max-width: 44%;
      color: rgba(240,237,232,.5); font-size: 13px; letter-spacing: 1px;
      line-height: 1.7; transition: opacity 2s ease;
    }
    .touch-btn {
      position: absolute; width: clamp(64px, 20vw, 92px); height: clamp(64px, 20vw, 92px);
      border-radius: 50%;
      background: rgba(240,237,232,.12); border: 1px solid rgba(240,237,232,.4);
      color: rgba(240,237,232,.85); font-family: inherit; font-size: clamp(11px, 3vw, 14px);
      letter-spacing: 1px; display: flex; align-items: center; justify-content: center;
      pointer-events: auto; touch-action: none;
    }
    .touch-btn:active { background: rgba(255,120,30,.3); }
    #btn-jump { right: clamp(14px, 4vw, 20px); bottom: clamp(54px, 16vw, 74px); }
    #btn-roll { right: clamp(96px, 28vw, 126px); bottom: clamp(12px, 4vw, 16px); }
    .round-banner {
      position: absolute; top: 30%; left: 50%; transform: translate(-50%, 14px);
      font-size: clamp(20px, 7vw, 38px); letter-spacing: clamp(4px, 2.5vw, 12px);
      font-weight: 700; color: #ffb340; text-align: center; width: 92vw;
      text-shadow: 0 0 24px rgba(255, 110, 20, .7);
      opacity: 0; transition: opacity .8s ease, transform .8s ease;
      pointer-events: none;
    }
    .round-banner.show { opacity: 1; transform: translate(-50%, 0); }
    .round-banner.green {
      color: #5cff8f; text-shadow: 0 0 24px rgba(43, 255, 102, .7);
    }

    #ver {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      font-size: 10px; letter-spacing: 2px; color: rgba(240,237,232,.3);
    }

    /* pause button — opens the pause menu (also ESC on desktop) */
    #pause-btn {
      position: absolute; top: clamp(46px, 7vw, 58px); left: 50%; transform: translateX(-50%);
      width: clamp(34px, 9vw, 40px); height: clamp(34px, 9vw, 40px); border-radius: 50%;
      background: rgba(20, 12, 8, .55); border: 1px solid rgba(240,237,232,.3);
      color: rgba(240,237,232,.8); font-size: clamp(13px, 3.4vw, 16px); line-height: 1; cursor: pointer;
      pointer-events: auto; display: none; align-items: center; justify-content: center;
      letter-spacing: 1px; transition: background .2s ease, color .2s ease;
    }
    #pause-btn.shown { display: flex; }
    #pause-btn:hover { background: rgba(255,120,30,.3); color: #fff; }

    /* small level indicator (top-left, under the clock) */
    #level-indicator {
      position: absolute; top: clamp(78px, 22vw, 102px); left: clamp(10px, 3vw, 18px);
      font-size: clamp(11px, 3vw, 15px); font-weight: 700; letter-spacing: 2px;
      color: rgba(255,200,120,.9); text-shadow: 0 0 10px rgba(255,120,20,.5);
      background: rgba(12,6,3,.5); padding: 4px 10px; border-radius: 6px;
      border: 1px solid rgba(255,150,60,.25); display: none;
    }
    #level-indicator.shown { display: block; }

    /* door status (oven-interior level) */
    #door-status {
      position: absolute; top: clamp(92px, 18vw, 104px); left: 50%; transform: translateX(-50%);
      padding: clamp(6px, 1.6vw, 8px) clamp(14px, 4vw, 22px); border-radius: 20px;
      font-size: clamp(12px, 3.4vw, 16px); font-weight: 700;
      letter-spacing: 2px; white-space: nowrap; max-width: 92vw;
      background: rgba(12, 6, 3, .72); border: 1px solid rgba(240,237,232,.25);
      transition: color .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    #door-status.shut { color: rgba(255,150,120,.85); border-color: rgba(255,90,40,.4); }
    #door-status.soon {
      color: #ffd23f; border-color: rgba(255,210,63,.7);
      box-shadow: 0 0 20px rgba(255,200,40,.5); animation: doorBlink .35s steps(2) infinite;
    }
    #door-status.open {
      color: #6cf0ff; border-color: rgba(108,240,255,.8);
      box-shadow: 0 0 28px rgba(108,240,255,.7);
    }
    @keyframes doorBlink { 0% { opacity: 1; } 100% { opacity: .55; } }

    /* ── start screen (fully responsive, 320px → 1920px) ── */
    #startscreen {
      position: absolute; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 38%, rgba(40,16,6,.72), rgba(4,2,1,.95));
      opacity: 0; transition: opacity .5s ease; pointer-events: auto; z-index: 30;
      padding: clamp(16px, 5vh, 40px) clamp(16px, 4vw, 32px);
      overflow-y: auto;
    }
    #startscreen.shown { opacity: 1; }
    #start-card {
      width: 100%; max-width: min(560px, 92vw);
      display: flex; flex-direction: column; align-items: center; text-align: center;
      gap: clamp(10px, 2.4vh, 20px);
    }
    #start-title {
      font-size: clamp(30px, 9vw, 64px); letter-spacing: clamp(3px, 1.6vw, 12px);
      font-weight: 800; color: #ffb340; line-height: 1.05;
      text-shadow: 0 0 30px rgba(255,110,20,.6);
    }
    #start-premise {
      font-size: clamp(13px, 3.6vw, 18px); line-height: 1.5; color: rgba(240,237,232,.8);
      max-width: 42ch;
    }
    #start-controls {
      width: 100%; display: flex; flex-direction: column; gap: clamp(6px, 1.4vh, 10px);
      padding: clamp(12px, 3vw, 18px); border-radius: 12px;
      background: rgba(20,12,6,.5); border: 1px solid rgba(255,150,60,.18);
    }
    #start-controls .ctrl-head {
      font-size: clamp(10px, 2.6vw, 12px); letter-spacing: 3px;
      color: rgba(255,200,120,.7); margin-bottom: 2px;
    }
    .ctrl-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      font-size: clamp(12px, 3.2vw, 15px); color: rgba(240,237,232,.85);
    }
    .ctrl-row .keys {
      display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;
    }
    .ctrl-row .key {
      font-size: clamp(10px, 2.8vw, 13px); font-weight: 700; letter-spacing: 1px;
      color: #ffd9a0; background: rgba(255,150,60,.16);
      border: 1px solid rgba(255,170,80,.4); border-radius: 6px;
      padding: clamp(3px, 1vw, 5px) clamp(7px, 2vw, 11px); white-space: nowrap;
    }
    #start-howto {
      font-size: clamp(12px, 3.2vw, 16px); color: #5cff8f; letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(43,255,102,.4);
    }
    #start-btn {
      margin-top: clamp(4px, 1.5vh, 10px);
      padding: clamp(12px, 2.4vh, 16px) clamp(36px, 12vw, 56px);
      font-family: inherit; font-size: clamp(16px, 4.6vw, 22px);
      letter-spacing: clamp(2px, 1vw, 4px); font-weight: 800; color: #0a0604;
      background: #ffb340; border: none; border-radius: 10px; cursor: pointer;
      box-shadow: 0 0 28px rgba(255,150,40,.6); transition: transform .15s ease, box-shadow .2s ease;
    }
    #start-btn:hover { transform: scale(1.04); box-shadow: 0 0 40px rgba(255,150,40,.85); }
    #start-btn:active { transform: scale(.97); }

    /* ── pause menu ── */
    #pausescreen {
      position: absolute; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: clamp(14px, 3vh, 24px);
      background: rgba(4,2,1,.8); z-index: 40; pointer-events: auto;
      padding: clamp(16px, 5vh, 40px) clamp(16px, 4vw, 32px);
    }
    #pausescreen.shown { display: flex; }
    #pause-title {
      font-size: clamp(26px, 8vw, 52px); letter-spacing: clamp(4px, 2vw, 12px);
      font-weight: 800; color: #f0ede8; text-shadow: 0 0 24px rgba(255,150,40,.4);
    }
    .menu-btn {
      width: min(320px, 84vw); padding: clamp(12px, 2.4vh, 16px) 20px;
      font-family: inherit; font-size: clamp(14px, 4vw, 18px); letter-spacing: 2px;
      font-weight: 700; cursor: pointer; border-radius: 10px;
      transition: transform .12s ease, background .2s ease;
    }
    .menu-btn.primary {
      color: #0a0604; background: #ffb340; border: none;
      box-shadow: 0 0 24px rgba(255,150,40,.5);
    }
    .menu-btn.secondary {
      color: #f0ede8; background: transparent; border: 1px solid rgba(240,237,232,.45);
    }
    .menu-btn:hover { transform: scale(1.03); }
    .menu-btn.secondary:hover { background: rgba(240,237,232,.12); }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
