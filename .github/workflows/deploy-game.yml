name: Deploy SPUDVENTURE to GitHub Pages

on:
  push:
    branches: [claude/spudventure-threejs-game-tgpyti]
    paths:
      - 'spudventure/**'
      - '.github/workflows/deploy-game.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: spudventure
      - run: npx vite build
        working-directory: spudventure
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: spudventure/dist
      - id: deployment
        uses: actions/deploy-pages@v4
